function QuizSection({ topicId, accent }) {
  const qs = quizzes[topicId];
  const [current, setCurrent] = useState(0);
  const [selected, setSelected] = useState(null);
  const [showResult, setShowResult] = useState(false);
  const [score, setScore] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [finished, setFinished] = useState(false);

  const reset = useCallback(() => {
    setCurrent(0); setSelected(null); setShowResult(false);
    setScore(0); setAnswers([]); setFinished(false);
  }, []);

  if (finished) {
    const pct = Math.round((score / qs.length) * 100);
    const grade = pct >= 90 ? { emoji: "🏆", text: "ECCEZIONALE!", sub: "Sei prontissimo per l'interrogazione!" }
      : pct >= 70 ? { emoji: "💪", text: "BRAVO!", sub: "Quasi perfetto, rileggi dove hai sbagliato." }
      : pct >= 50 ? { emoji: "📖", text: "BUONO MA...", sub: "Rileggi gli step 1-3, poi rifai il quiz." }
      : { emoji: "🔄", text: "DA RIPASSARE", sub: "Torna agli step e studia con calma, poi riprova!" };
    return (
      <div style={{ textAlign: "center", padding: "20px 0" }}>
        <div style={{ fontSize: "56px", marginBottom: "8px" }}>{grade.emoji}</div>
        <div style={{ fontSize: "24px", fontWeight: "800", color: accent }}>{grade.text}</div>
        <div style={{ fontSize: "14px", color: "#666", marginTop: "4px", marginBottom: "16px" }}>{grade.sub}</div>
        <div style={{
          display: "inline-block", background: accent + "12", borderRadius: "16px",
          padding: "16px 32px", marginBottom: "20px",
        }}>
          <div style={{ fontSize: "40px", fontWeight: "800", color: accent }}>{score}/{qs.length}</div>
          <div style={{ fontSize: "13px", color: "#888" }}>risposte corrette</div>
        </div>
        {/* Review wrong answers */}
        {answers.some(a => !a.correct) && (
          <div style={{ textAlign: "left", marginTop: "16px" }}>
            <div style={{ fontSize: "14px", fontWeight: "700", color: "#E74C3C", marginBottom: "10px" }}>
              Dove hai sbagliato:
            </div>
            {answers.filter(a => !a.correct).map((a, i) => (
              <div key={i} style={{
                background: "#FFF5F5", border: "1px solid #FED7D7", borderRadius: "10px",
                padding: "12px", marginBottom: "8px", fontSize: "13px", lineHeight: "1.6",
              }}>
                <div style={{ fontWeight: "700", color: "#333", marginBottom: "4px" }}>❌ {a.question}</div>
                <div style={{ color: "#E74C3C" }}>Hai risposto: {a.yourAnswer}</div>
                <div style={{ color: "#27AE60", fontWeight: "600" }}>Risposta giusta: {a.correctAnswer}</div>
                <div style={{ color: "#666", marginTop: "4px", fontStyle: "italic" }}>{a.explain}</div>
              </div>
            ))}
          </div>
        )}
        <button onClick={reset} style={{
          marginTop: "16px", padding: "14px 32px", borderRadius: "50px",
          background: accent, color: "#fff", border: "none",
          fontSize: "15px", fontWeight: "700", cursor: "pointer",
          boxShadow: `0 4px 16px ${accent}44`,
        }}>🔄 Rifai il quiz</button>
      </div>
    );
  }

  const question = qs[current];
  const isCorrect = selected === question.correct;

  const handleSelect = (idx) => {
    if (showResult) return;
    setSelected(idx);
    setShowResult(true);
    if (idx === question.correct) setScore(s => s + 1);
    setAnswers(prev => [...prev, {
      question: question.q,
      correct: idx === question.correct,
      yourAnswer: question.opts[idx],
      correctAnswer: question.opts[question.correct],
      explain: question.explain,
    }]);
  };

  const nextQ = () => {
    if (current + 1 >= qs.length) { setFinished(true); return; }
    setCurrent(c => c + 1); setSelected(null); setShowResult(false);
  };

  return (
    <div>
      {/* Progress bar */}
      <div style={{ display: "flex", gap: "4px", marginBottom: "16px" }}>
        {qs.map((_, i) => (
          <div key={i} style={{
            flex: 1, height: "5px", borderRadius: "3px",
            background: i < current ? accent : i === current ? accent + "55" : "#eee",
            transition: "background 0.3s",
          }} />
        ))}
      </div>
      <div style={{ fontSize: "12px", color: "#999", marginBottom: "12px", fontWeight: "600" }}>
        Domanda {current + 1} di {qs.length} · Punteggio: {score}/{current}
      </div>

      {/* Question */}
      <div style={{
        fontSize: "16px", fontWeight: "700", color: "#1a1a2e",
        lineHeight: "1.5", marginBottom: "16px",
      }}>
        {question.q}
      </div>

      {/* Options */}
      <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
        {question.opts.map((opt, idx) => {
          let bg = "#fff", border = "#e8e8e8", color = "#333", fw = "500";
          if (showResult) {
            if (idx === question.correct) { bg = "#E8F8EF"; border = "#27AE60"; color = "#1B7A3D"; fw = "700"; }
            else if (idx === selected && !isCorrect) { bg = "#FFF5F5"; border = "#E74C3C"; color = "#C53030"; fw = "600"; }
            else { bg = "#f9f9f9"; color = "#aaa"; }
          } else if (idx === selected) {
            bg = accent + "15"; border = accent;
          }
          return (
            <button key={idx} onClick={() => handleSelect(idx)} style={{
              padding: "12px 16px", borderRadius: "12px",
              border: `2px solid ${border}`, background: bg, color,
              fontSize: "14px", fontWeight: fw, textAlign: "left",
              cursor: showResult ? "default" : "pointer",
              transition: "all 0.2s", lineHeight: "1.5",
              display: "flex", alignItems: "center", gap: "10px",
            }}>
              <span style={{
                width: "28px", height: "28px", borderRadius: "8px",
                display: "flex", alignItems: "center", justifyContent: "center",
                background: showResult && idx === question.correct ? "#27AE60" : showResult && idx === selected && !isCorrect ? "#E74C3C" : "#f0f0f0",
                color: showResult && (idx === question.correct || (idx === selected && !isCorrect)) ? "#fff" : "#888",
                fontSize: "13px", fontWeight: "800", flexShrink: 0,
              }}>
                {showResult && idx === question.correct ? "✓" : showResult && idx === selected && !isCorrect ? "✗" : String.fromCharCode(65 + idx)}
              </span>
              {opt}
            </button>
          );
        })}
      </div>

      {/* Explanation */}
      {showResult && (
        <div style={{
          marginTop: "14px", padding: "14px",
          background: isCorrect ? "#E8F8EF" : "#FFF5F5",
          borderRadius: "12px", fontSize: "13px", lineHeight: "1.6",
          border: `1px solid ${isCorrect ? "#A7E8C0" : "#FED7D7"}`,
          animation: "slideDown 0.3s ease",
        }}>
          <span style={{ fontWeight: "800", color: isCorrect ? "#27AE60" : "#E74C3C" }}>
            {isCorrect ? "✅ Esatto! " : "❌ Non proprio. "}
          </span>
          <span style={{ color: "#555" }}>{question.explain}</span>
        </div>
      )}

      {showResult && (
        <button onClick={nextQ} style={{
          marginTop: "14px", width: "100%", padding: "14px",
          borderRadius: "12px", background: accent, color: "#fff",
          border: "none", fontSize: "15px", fontWeight: "700",
          cursor: "pointer", boxShadow: `0 4px 14px ${accent}33`,
        }}>
          {current + 1 >= qs.length ? "🏆 Vedi risultato" : "Prossima domanda →"}
        </button>
      )}
    </div>
  );
}

                    <div style={{ fontSize: "12px", color: "#999" }}>{step.desc}</div>
                  </div>
                  <span style={{ fontSize: "20px", color: topic.accent, transform: isOpen ? "rotate(180deg)" : "rotate(0)", transition: "transform 0.3s ease", opacity: 0.6 }}>▼</span>
                </button>
                {isOpen && (
                  <div style={{ padding: "4px 18px 18px", animation: "slideDown 0.35s ease", overflow: "hidden" }}>
                    <div style={{ width: "40px", height: "3px", borderRadius: "2px", background: topic.accent + "30", marginBottom: "14px" }} />
                    {isQuiz ? (
                      <QuizSection key={`${topic.id}-${quizKeys[topic.id] || 0}`} topicId={topic.id} accent={topic.accent} />
                    ) : (
                      topic[step.key].map((b, i) => renderBlock(b, i))
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        <div style={{ textAlign: "center", margin: "20px 0 8px", fontSize: "12px", color: "#aaa", lineHeight: "1.5" }}>
          Studia gli step 1→2→3, poi mettiti alla prova con il quiz 🎯
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
